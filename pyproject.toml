[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wd9000"
version = "0.1.0"
description = "Wasp Destroyer 9000 host-side software"
requires-python = ">=3.10,<3.14"
dependencies = [
    "inference-sdk>=1.5",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
